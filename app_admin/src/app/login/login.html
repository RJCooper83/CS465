<div class="container">
  <h2>Login</h2>

  <div class="alert alert-danger" *ngIf="formError">
  {{ formError }}
</div>

  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        required
        class="form-control"
        name="email"
        [(ngModel)]="email"
      />
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        required
        class="form-control"
        name="password"
        [(ngModel)]="password"
      />
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>

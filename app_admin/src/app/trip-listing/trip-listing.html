<!--<pre>{{ trips | json }}</pre> line -->

<div>
  <button *ngIf="isLoggedIn()" (click)="addTrip()" class="btn btn-info mb-3">Add Trip</button>
</div>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (delete)="deleteTrip($event)" class="card-deck mt-2"></app-trip-card>
  </div>
</div>
